# yaml-language-server: $schema=https://raw.githubusercontent.com/siemens/kas/master/kas/schema-kas.json

header:
  version: 14
  includes:
    - repo: meta-foundries
      file: ci/include/base.yml
    - repo: meta-foundries
      file: ci/include/base.lock.yml
    - repo: meta-foundries
      file: ci/include/nodistro.yml

repos:
  meta-foundries:
    url: https://github.com/foundriesio/meta-foundries
    commit: 4dbe7efc08aef350f247aca83e518a9197c9a31a
  meta-intel:
    url: https://git.yoctoproject.org/meta-intel
    commit: master
    layers:
      .:

machine: intel-corei7-64

local_conf_header:
  ci: |
    BB_SIGNATURE_HANDLER = "OEBasicHash"
    SOTA_SKIP_CRED_WARN = "1"

  rm-work: |
    RM_WORK_EXCLUDE += "fioconfig aktualizr-lite composectl fio-device-register"

  andy: |
    FIO_DEVICE_API = "https://dg-me.infra.foundries.io/v1/devices"
    FIO_OAUTH_API = "https://dg-me.infra.foundries.io/oauth2"
    LMP_FACTORY = "ogs"
    IMAGE_INSTALL:append = " sudo"

  sota-boot: |
    OSTREE_BOOTLOADER = "grub"
    EFI_PROVIDER = "grub-efi"
    WKS_FILE:sota = "efiimage-sota.wks.in"
    IMAGE_BOOT_FILES:sota = ""
    IMAGE_FSTYPES:append:pn-core-image-full-cmdline = " wic wic.qcow2"
    OSTREE_KERNEL_ARGS = "console=${KERNEL_CONSOLE} ${OSTREE_KERNEL_ARGS_COMMON}"
    EXTRA_IMAGEDEPENDS:append = " ovmf"
