BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"

# Only expose Intel kernel appends when meta-intel is present.
BBFILES_DYNAMIC += "intel:${LAYERDIR}/dynamic-layers/intel/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "project"
BBFILE_PATTERN_project = "^${LAYERDIR}/"
BBFILE_PRIORITY_project = "10"
LAYERDEPENDS_project = "core"
LAYERSERIES_COMPAT_project = "wrynose blacksail"
